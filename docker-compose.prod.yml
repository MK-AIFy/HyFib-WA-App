# Production overlay for the HyFib WhatsApp platform (modular monolith).
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Runs the consolidated app-server with NODE_ENV=production, which fails fast on
# placeholder secrets (see packages/config requireSecret). The in-process event
# bus (EVENT_BUS=memory, from the base compose) needs no broker; to scale the
# worker out to a separate process again, set EVENT_BUS=rabbitmq + RABBITMQ_URL
# and add a rabbitmq service back.
#
# Multi-node HA (Postgres streaming replication) and a perimeter WAF are
# environment-specific; see the runbooks under docs/runbooks/.

services:
  app-server:
    environment:
      NODE_ENV: production
