services:
  edge-proxy:
    image: nginx:1.27-alpine
    container_name: edge-proxy
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/nginx/certs:/etc/nginx/certs:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - api-gateway
      - web-portal
    networks:
      - dmz-net
      - app-net
    restart: unless-stopped

  web-portal:
    build:
      context: .
      dockerfile: services/web-portal/Dockerfile
    container_name: web-portal
    env_file:
      - .env
    ports:
      - "3001:3000"
    networks:
      - app-net
    restart: unless-stopped

  postgres-primary:
    image: postgres:16-alpine
    container_name: postgres-primary
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      APP_DB_USER: ${POSTGRES_APP_USER}
      APP_DB_PASSWORD: ${POSTGRES_APP_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - pg_primary_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    networks:
      - data-net
    restart: unless-stopped

  postgres-standby:
    image: postgres:16-alpine
    container_name: postgres-standby
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    depends_on:
      - postgres-primary
    volumes:
      - pg_standby_data:/var/lib/postgresql/data
    networks:
      - data-net
    restart: unless-stopped

  postgres-replica:
    image: postgres:16-alpine
    container_name: postgres-replica
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    depends_on:
      - postgres-primary
    volumes:
      - pg_replica_data:/var/lib/postgresql/data
    networks:
      - data-net
    restart: unless-stopped

  redis-master:
    image: redis:7.4-alpine
    container_name: redis-master
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - redis_master_data:/data
    networks:
      - data-net
    restart: unless-stopped

  redis-replica:
    image: redis:7.4-alpine
    container_name: redis-replica
    command: ["redis-server", "--replicaof", "redis-master", "6379", "--masterauth", "${REDIS_PASSWORD}", "--requirepass", "${REDIS_PASSWORD}"]
    depends_on:
      - redis-master
    volumes:
      - redis_replica_data:/data
    networks:
      - data-net
    restart: unless-stopped

  redis-sentinel-1:
    image: redis:7.4-alpine
    container_name: redis-sentinel-1
    command: ["sh", "-c", "redis-sentinel /etc/redis/sentinel.conf"]
    volumes:
      - ./infra/redis/sentinel.conf:/etc/redis/sentinel.conf:ro
    depends_on:
      - redis-master
    networks:
      - data-net
    restart: unless-stopped

  redis-sentinel-2:
    image: redis:7.4-alpine
    container_name: redis-sentinel-2
    command: ["sh", "-c", "redis-sentinel /etc/redis/sentinel.conf"]
    volumes:
      - ./infra/redis/sentinel.conf:/etc/redis/sentinel.conf:ro
    depends_on:
      - redis-master
    networks:
      - data-net
    restart: unless-stopped

  redis-sentinel-3:
    image: redis:7.4-alpine
    container_name: redis-sentinel-3
    command: ["sh", "-c", "redis-sentinel /etc/redis/sentinel.conf"]
    volumes:
      - ./infra/redis/sentinel.conf:/etc/redis/sentinel.conf:ro
    depends_on:
      - redis-master
    networks:
      - data-net
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    ports:
      - "15672:15672"
    networks:
      - data-net
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    networks:
      - data-net
    restart: unless-stopped

  opensearch:
    image: opensearchproject/opensearch:2.18.0
    container_name: opensearch
    environment:
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
      - DISABLE_SECURITY_PLUGIN=true
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    ports:
      - "9200:9200"
    networks:
      - data-net
    restart: unless-stopped

  vault:
    image: hashicorp/vault:1.18
    container_name: vault
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_DEV_ROOT_TOKEN_ID}
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    command: vault server -dev
    ports:
      - "8200:8200"
    networks:
      - app-net
      - data-net
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:26.1
    container_name: keycloak
    command: start-dev --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL_HOST: postgres-primary
      KC_DB_URL_DATABASE: ${POSTGRES_DB}
      KC_DB_USERNAME: ${POSTGRES_USER}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
    volumes:
      - ./infra/keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    ports:
      - "8081:8080"
    depends_on:
      - postgres-primary
    networks:
      - app-net
      - data-net
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.55.0
    container_name: prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - app-net
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.3.0
    container_name: grafana
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    networks:
      - app-net
    restart: unless-stopped

  api-gateway:
    build:
      context: .
      dockerfile: services/api-gateway/Dockerfile
    container_name: api-gateway
    env_file:
      - .env
    depends_on:
      - rabbitmq
      - redis-master
      - postgres-primary
      - webhook-ingestor
      - notification-worker
      - meta-adapter
    ports:
      - "18080:8080"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - app-net
      - data-net
    restart: unless-stopped

  meta-adapter:
    build:
      context: .
      dockerfile: services/meta-adapter/Dockerfile
    env_file:
      - .env
    networks:
      - app-net
      - data-net
    restart: unless-stopped

  webhook-ingestor:
    build:
      context: .
      dockerfile: services/webhook-ingestor/Dockerfile
    env_file:
      - .env
    networks:
      - app-net
      - data-net
    restart: unless-stopped

  notification-worker:
    build:
      context: .
      dockerfile: services/notification-worker/Dockerfile
    env_file:
      - .env
    depends_on:
      - rabbitmq
    networks:
      - app-net
      - data-net
    restart: unless-stopped

  ai-intelligence-service:
    build:
      context: .
      dockerfile: services/ai-intelligence-service/Dockerfile
    env_file:
      - .env
    networks:
      - app-net
      - data-net
    restart: unless-stopped

networks:
  dmz-net:
  app-net:
  data-net:

volumes:
  pg_primary_data:
  pg_standby_data:
  pg_replica_data:
  redis_master_data:
  redis_replica_data:
  rabbitmq_data:
  minio_data:
  opensearch_data:
  prometheus_data:
  grafana_data:
