services:
  edge-proxy:
    # nginx stable branch, not a minor-pinned tag (see services/web-app/Dockerfile).
    image: nginx:stable-alpine
    container_name: edge-proxy
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/nginx/certs:/etc/nginx/certs:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - app-server
      - web-app
    networks:
      - dmz-net
      - app-net
    restart: unless-stopped

  # Modular monolith: gateway + ingestor + meta + worker + ai/billing/reporting
  # in one process on an in-process event bus. Replaces the former 7 services.
  app-server:
    build:
      context: .
      dockerfile: services/app-server/Dockerfile
    container_name: app-server
    env_file:
      - .env
    environment:
      # In-process event bus (no RabbitMQ). Set EVENT_BUS=rabbitmq + RABBITMQ_URL
      # to scale the worker out to a separate process again.
      - EVENT_BUS=memory
    depends_on:
      - postgres-primary
      - redis-master
    ports:
      - "18080:8080"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - app-net
      - data-net
    restart: unless-stopped

  web-app:
    build:
      context: .
      dockerfile: services/web-app/Dockerfile
    container_name: web-app
    ports:
      - "3002:8080"
    networks:
      - app-net
    depends_on:
      - app-server
    restart: unless-stopped

  postgres-primary:
    image: postgres:16-alpine
    container_name: postgres-primary
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      APP_DB_USER: ${POSTGRES_APP_USER}
      APP_DB_PASSWORD: ${POSTGRES_APP_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - pg_primary_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    networks:
      - data-net
    restart: unless-stopped

  redis-master:
    image: redis:7.4-alpine
    container_name: redis-master
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - redis_master_data:/data
    networks:
      - data-net
    restart: unless-stopped

  # ── Observability (opt-in): docker compose --profile observability up ──
  prometheus:
    image: prom/prometheus:v2.55.0
    container_name: prometheus
    profiles: ["observability"]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - app-net
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.3.0
    container_name: grafana
    profiles: ["observability"]
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    networks:
      - app-net
    restart: unless-stopped

networks:
  dmz-net:
  app-net:
  data-net:

volumes:
  pg_primary_data:
  redis_master_data:
  prometheus_data:
  grafana_data:
