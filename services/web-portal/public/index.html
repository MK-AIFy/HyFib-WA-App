<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>HyFib WhatsApp Business</title>
    <style>
      :root {
        --bg: #0e1117;
        --surface: #161b22;
        --surface2: #21262d;
        --border: #30363d;
        --brand: #25d366;
        --brand-dim: rgba(37, 211, 102, 0.12);
        --brand-dark: #128c7e;
        --accent: #58a6ff;
        --text: #e6edf3;
        --muted: #8b949e;
        --danger: #f85149;
        --warn: #d29922;
        --radius: 10px;
        --sidebar-w: 200px;
        --convlist-w: 280px;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: "Segoe UI", system-ui, sans-serif;
        background: var(--bg);
        color: var(--text);
        height: 100vh;
        overflow: hidden;
        font-size: 14px;
      }
      a {
        color: var(--brand);
        text-decoration: none;
      }
      code {
        font-family: monospace;
        background: var(--surface2);
        padding: 2px 6px;
        border-radius: 4px;
        font-size: 12px;
      }
      .field {
        margin-bottom: 14px;
      }
      .field label {
        display: block;
        font-size: 11px;
        color: var(--muted);
        margin-bottom: 5px;
        text-transform: uppercase;
        letter-spacing: 0.06em;
      }
      .field input,
      .field select,
      .field textarea {
        width: 100%;
        background: var(--bg);
        border: 1px solid var(--border);
        color: var(--text);
        border-radius: 8px;
        padding: 9px 12px;
        font: inherit;
        font-size: 13px;
        transition: border-color 0.15s;
      }
      .field input:focus,
      .field select:focus,
      .field textarea:focus {
        outline: none;
        border-color: var(--brand);
      }
      .field select option {
        background: var(--surface2);
      }
      .field textarea {
        resize: vertical;
        min-height: 72px;
      }
      .btn {
        padding: 9px 16px;
        border: none;
        border-radius: 8px;
        font: inherit;
        font-weight: 600;
        font-size: 13px;
        cursor: pointer;
        transition: opacity 0.15s;
      }
      .btn:hover {
        opacity: 0.85;
      }
      .btn:disabled {
        opacity: 0.45;
        cursor: default;
      }
      .btn-primary {
        background: var(--brand);
        color: #000;
      }
      .btn-secondary {
        background: var(--surface2);
        color: var(--text);
        border: 1px solid var(--border);
      }
      .btn-danger {
        background: var(--danger);
        color: #fff;
      }
      .btn-sm {
        padding: 5px 11px;
        font-size: 12px;
      }
      .btn-icon {
        padding: 5px 8px;
        background: var(--surface2);
        border: 1px solid var(--border);
        color: var(--text);
        border-radius: 7px;
        cursor: pointer;
        font-size: 15px;
        line-height: 1;
      }
      #setup {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
      }
      .setup-card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 36px;
        width: 430px;
      }
      .setup-card .logo {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 6px;
      }
      .setup-card .logo h1 {
        font-size: 20px;
      }
      .setup-card .subtitle {
        color: var(--muted);
        font-size: 13px;
        margin-bottom: 24px;
      }
      .steps {
        display: flex;
        gap: 6px;
        margin-bottom: 22px;
      }
      .step-dot {
        flex: 1;
        height: 3px;
        border-radius: 2px;
        background: var(--border);
      }
      .step-dot.done {
        background: var(--brand);
      }
      #app {
        display: grid;
        grid-template-columns: var(--sidebar-w) 1fr;
        grid-template-rows: 48px 1fr;
        height: 100vh;
      }
      #topbar {
        grid-column: 1/-1;
        background: var(--surface);
        border-bottom: 1px solid var(--border);
        display: flex;
        align-items: center;
        padding: 0 14px;
        gap: 10px;
      }
      #topbar .brand {
        font-weight: 700;
        color: var(--brand);
        font-size: 15px;
        white-space: nowrap;
      }
      #topbar .sep {
        color: var(--border);
      }
      #topbar .tname {
        font-size: 13px;
        color: var(--muted);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        max-width: 160px;
      }
      #topbar .phone-pill {
        font-size: 11px;
        background: var(--surface2);
        border: 1px solid var(--border);
        padding: 2px 8px;
        border-radius: 20px;
        color: var(--muted);
        white-space: nowrap;
      }
      #topbar .spacer {
        flex: 1;
      }
      #topbar select {
        background: var(--surface2);
        border: 1px solid var(--border);
        color: var(--text);
        padding: 3px 7px;
        border-radius: 6px;
        font-size: 11px;
        max-width: 150px;
      }
      .sse-pill {
        display: flex;
        align-items: center;
        gap: 5px;
        font-size: 11px;
        color: var(--muted);
        white-space: nowrap;
      }
      .sse-dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--muted);
      }
      .sse-dot.on {
        background: var(--brand);
      }
      #sidebar {
        background: var(--surface);
        border-right: 1px solid var(--border);
        padding: 10px 7px;
        display: flex;
        flex-direction: column;
        gap: 3px;
        overflow: hidden;
      }
      .nav-btn {
        display: flex;
        align-items: center;
        gap: 9px;
        padding: 8px 9px;
        border-radius: 8px;
        cursor: pointer;
        font-size: 13px;
        color: var(--muted);
        border: none;
        background: none;
        width: 100%;
        text-align: left;
        white-space: nowrap;
        overflow: hidden;
      }
      .nav-btn:hover {
        background: var(--surface2);
        color: var(--text);
      }
      .nav-btn.active {
        background: var(--brand-dim);
        color: var(--brand);
      }
      .nav-btn .ni {
        font-size: 15px;
        width: 18px;
        text-align: center;
        flex-shrink: 0;
      }
      #content {
        overflow: hidden;
        height: 100%;
      }
      .view {
        display: none;
        height: 100%;
      }
      .view.active {
        display: flex;
      }
      #v-inbox {
        flex-direction: row;
        height: 100%;
      }
      #conv-list {
        width: var(--convlist-w);
        min-width: 220px;
        flex-shrink: 0;
        border-right: 1px solid var(--border);
        display: flex;
        flex-direction: column;
        background: var(--surface);
      }
      .cl-header {
        padding: 10px 14px;
        border-bottom: 1px solid var(--border);
        font-size: 13px;
        font-weight: 600;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 6px;
        flex-wrap: wrap;
      }
      .cl-filters {
        display: flex;
        gap: 5px;
        padding: 8px 10px;
        border-bottom: 1px solid var(--border);
      }
      .cl-filters select {
        background: var(--bg);
        border: 1px solid var(--border);
        color: var(--text);
        padding: 4px 7px;
        border-radius: 6px;
        font-size: 11px;
        flex: 1;
      }
      #conv-scroll {
        flex: 1;
        overflow-y: auto;
      }
      .ci {
        padding: 11px 14px;
        cursor: pointer;
        border-bottom: 1px solid var(--border);
        transition: background 0.1s;
      }
      .ci:hover {
        background: var(--surface2);
      }
      .ci.sel {
        background: var(--brand-dim);
        border-left: 3px solid var(--brand);
      }
      .ci .ci-name {
        font-weight: 600;
        font-size: 13px;
        margin-bottom: 2px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        max-width: 180px;
      }
      .ci .ci-preview {
        font-size: 12px;
        color: var(--muted);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .ci .ci-time {
        font-size: 10px;
        color: var(--muted);
        float: right;
        margin-top: 2px;
      }
      .ci .ci-badges {
        margin-top: 4px;
        display: flex;
        gap: 4px;
        flex-wrap: wrap;
      }
      #chat {
        flex: 1;
        display: flex;
        flex-direction: column;
        min-width: 0;
      }
      #chat-header {
        padding: 11px 18px;
        border-bottom: 1px solid var(--border);
        background: var(--surface);
        display: flex;
        align-items: center;
        gap: 10px;
        flex-shrink: 0;
        flex-wrap: wrap;
      }
      .ch-name {
        font-weight: 600;
        font-size: 14px;
      }
      .ch-phone {
        font-size: 11px;
        color: var(--muted);
      }
      .ch-actions {
        margin-left: auto;
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
      }
      #msgs {
        flex: 1;
        overflow-y: auto;
        padding: 14px;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .msg {
        max-width: 62%;
        padding: 9px 13px;
        border-radius: 12px;
        font-size: 13px;
        line-height: 1.45;
        word-break: break-word;
      }
      .msg.in {
        align-self: flex-start;
        background: var(--surface2);
        border-bottom-left-radius: 3px;
      }
      .msg.out {
        align-self: flex-end;
        background: var(--brand-dark);
        color: #fff;
        border-bottom-right-radius: 3px;
      }
      .msg .mt {
        font-size: 10px;
        opacity: 0.55;
        margin-top: 4px;
        text-align: right;
      }
      .msg.in .mt {
        text-align: left;
      }
      #input-row {
        padding: 10px 14px;
        border-top: 1px solid var(--border);
        background: var(--surface);
        display: flex;
        gap: 8px;
        align-items: flex-end;
        flex-shrink: 0;
      }
      #msg-input {
        flex: 1;
        background: var(--bg);
        border: 1px solid var(--border);
        color: var(--text);
        border-radius: 9px;
        padding: 9px 13px;
        font: inherit;
        font-size: 13px;
        resize: none;
        max-height: 110px;
        line-height: 1.4;
      }
      #msg-input:focus {
        outline: none;
        border-color: var(--brand);
      }
      #no-conv {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        color: var(--muted);
        gap: 6px;
        text-align: center;
        padding: 20px;
      }
      #no-conv .big {
        font-size: 44px;
        margin-bottom: 4px;
      }
      .pv {
        flex-direction: column;
        overflow-y: auto;
        padding: 22px 26px;
        gap: 18px;
      }
      .pv-head {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 10px;
        flex-shrink: 0;
        flex-wrap: wrap;
      }
      .pv-head h2 {
        font-size: 18px;
        font-weight: 700;
      }
      .pv-head .sub {
        color: var(--muted);
        font-size: 12px;
        margin-top: 3px;
      }
      .pv-head .acts {
        display: flex;
        gap: 7px;
        flex-wrap: wrap;
      }
      .card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 11px;
        padding: 18px;
      }
      .card-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 14px;
        gap: 8px;
      }
      .card-head h3 {
        font-size: 11px;
        font-weight: 600;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.07em;
      }
      .kpis {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 10px;
        flex-shrink: 0;
      }
      .kpi {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 14px;
      }
      .kpi b {
        font-size: 22px;
        display: block;
        margin-bottom: 3px;
      }
      .kpi span {
        font-size: 11px;
        color: var(--muted);
      }
      .tbl {
        width: 100%;
        border-collapse: collapse;
        font-size: 12px;
      }
      .tbl th {
        text-align: left;
        padding: 7px 11px;
        color: var(--muted);
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 0.07em;
        border-bottom: 1px solid var(--border);
        font-weight: 600;
      }
      .tbl td {
        padding: 9px 11px;
        border-bottom: 1px solid var(--border);
        vertical-align: middle;
      }
      .tbl tr:last-child td {
        border-bottom: none;
      }
      .tbl tr:hover td {
        background: rgba(255, 255, 255, 0.02);
      }
      .bdg {
        display: inline-block;
        padding: 2px 7px;
        border-radius: 20px;
        font-size: 10px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }
      .bdg-green {
        background: rgba(37, 211, 102, 0.14);
        color: #25d366;
      }
      .bdg-yellow {
        background: rgba(210, 153, 34, 0.14);
        color: #d29922;
      }
      .bdg-red {
        background: rgba(248, 81, 73, 0.14);
        color: #f85149;
      }
      .bdg-blue {
        background: rgba(88, 166, 255, 0.14);
        color: #58a6ff;
      }
      .bdg-gray {
        background: var(--surface2);
        color: var(--muted);
      }
      .overlay {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.65);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 100;
      }
      .modal {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 13px;
        padding: 26px;
        width: 500px;
        max-width: 95vw;
        max-height: 90vh;
        overflow-y: auto;
      }
      .modal h3 {
        font-size: 16px;
        font-weight: 700;
        margin-bottom: 18px;
      }
      .modal .mact {
        display: flex;
        gap: 8px;
        justify-content: flex-end;
        margin-top: 18px;
      }
      .alert {
        padding: 9px 13px;
        border-radius: 8px;
        font-size: 12px;
        margin-bottom: 12px;
      }
      .alert-err {
        background: rgba(248, 81, 73, 0.1);
        border: 1px solid rgba(248, 81, 73, 0.3);
        color: var(--danger);
      }
      .alert-ok {
        background: rgba(37, 211, 102, 0.1);
        border: 1px solid rgba(37, 211, 102, 0.3);
        color: var(--brand);
      }
      .alert-info {
        background: rgba(88, 166, 255, 0.1);
        border: 1px solid rgba(88, 166, 255, 0.3);
        color: var(--accent);
      }
      .info-box {
        background: rgba(88, 166, 255, 0.07);
        border: 1px solid rgba(88, 166, 255, 0.2);
        border-radius: 9px;
        padding: 12px 14px;
        font-size: 12px;
        color: var(--accent);
      }
      .info-box b {
        display: block;
        margin-bottom: 5px;
        font-size: 13px;
      }
      .empty {
        text-align: center;
        padding: 32px;
        color: var(--muted);
      }
      .empty .ei {
        font-size: 32px;
        margin-bottom: 8px;
      }
      .spin {
        width: 20px;
        height: 20px;
        border: 2px solid var(--border);
        border-top-color: var(--brand);
        border-radius: 50%;
        animation: sp 0.6s linear infinite;
        display: inline-block;
      }
      @keyframes sp {
        to {
          transform: rotate(360deg);
        }
      }
      .loading {
        display: flex;
        justify-content: center;
        padding: 24px;
      }
      #toast {
        position: fixed;
        bottom: 22px;
        right: 22px;
        background: var(--surface2);
        border: 1px solid var(--border);
        border-radius: 9px;
        padding: 10px 16px;
        font-size: 13px;
        z-index: 200;
        opacity: 0;
        transition: opacity 0.2s;
        pointer-events: none;
        max-width: 300px;
      }
      #toast.show {
        opacity: 1;
      }
      #toast.tok {
        border-color: var(--brand);
        color: var(--brand);
      }
      #toast.terr {
        border-color: var(--danger);
        color: var(--danger);
      }
      #toast.twarn {
        border-color: var(--warn);
        color: var(--warn);
      }
      .row {
        display: flex;
        gap: 8px;
        align-items: center;
        flex-wrap: wrap;
      }
      .funnel {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin-bottom: 14px;
      }
      .funnel-bar {
        flex: 1;
        min-width: 80px;
        background: var(--surface2);
        border-radius: 8px;
        padding: 12px;
        text-align: center;
      }
      .funnel-bar .fb-n {
        font-size: 20px;
        font-weight: 700;
      }
      .funnel-bar .fb-l {
        font-size: 10px;
        color: var(--muted);
        margin-top: 3px;
      }
      .drop-zone {
        border: 2px dashed var(--border);
        border-radius: 10px;
        padding: 24px;
        text-align: center;
        cursor: pointer;
        color: var(--muted);
        transition:
          border-color 0.15s,
          background 0.15s;
      }
      .drop-zone:hover,
      .drop-zone.drag {
        border-color: var(--brand);
        background: var(--brand-dim);
        color: var(--brand);
      }
      .drop-zone input[type="file"] {
        display: none;
      }
      .var-row {
        display: grid;
        grid-template-columns: 60px 1fr 1fr;
        gap: 8px;
        align-items: center;
        margin-bottom: 8px;
        font-size: 12px;
      }
      .var-row label {
        color: var(--muted);
        text-align: center;
        font-family: monospace;
      }
      ::-webkit-scrollbar {
        width: 4px;
      }
      ::-webkit-scrollbar-thumb {
        background: var(--border);
        border-radius: 2px;
      }
      @media (max-width: 800px) {
        :root {
          --sidebar-w: 48px;
          --convlist-w: 200px;
        }
        .nav-btn span {
          display: none;
        }
        .kpis {
          grid-template-columns: repeat(2, 1fr);
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="toast"></div>
    <script type="module" src="/lib.mjs"></script>
    <script>
      // ═══════════════════ STATE ═══════════════════
      const S = {
        tenantId: localStorage.getItem("hf_tid") || "",
        tenantName: localStorage.getItem("hf_tname") || "",
        channelId: localStorage.getItem("hf_chid") || "",
        channelPhone: localStorage.getItem("hf_chphone") || "",
        role: localStorage.getItem("hf_role") || "marketing_manager",
        setupStep: 1,
        view: "inbox",
        conversations: [],
        activeConvId: null,
        messages: [],
        contacts: [],
        templates: [],
        campaigns: [],
        segments: [],
        autoRules: [],
        users: [],
        msgBefore: null,
        convFilter: { state: "", assignee: "" },
        waSettingsChannelId: null
      };

      // ═══════════════════ UTILS ═══════════════════
      // esc/fmtTime/pagerHtml/buildQuery are provided by /lib.mjs (attached to window).

      let _tt;
      function toast(msg, type) {
        const el = document.getElementById("toast");
        el.textContent = msg;
        el.className = "show" + (type === "ok" ? " tok" : type === "err" ? " terr" : type === "warn" ? " twarn" : "");
        clearTimeout(_tt);
        _tt = setTimeout(() => (el.className = ""), 3500);
      }

      function bdg(text, type) {
        return '<span class="bdg bdg-' + (type || "gray") + '">' + esc(text) + "</span>";
      }

      function statusBdg(s) {
        const m = {
          approved: "green",
          active: "green",
          running: "blue",
          pending: "yellow",
          rejected: "red",
          paused: "yellow",
          draft: "gray",
          completed: "green",
          scheduled: "blue",
          open: "green",
          closed: "gray",
          consent_active: "green",
          sent: "blue",
          delivered: "green",
          read: "green",
          failed: "red",
          policy_skipped: "yellow"
        };
        return bdg(s, m[s] || "gray");
      }

      function loading() {
        return '<div class="loading"><div class="spin"></div></div>';
      }
      function empty(icon, msg) {
        return '<div class="empty"><div class="ei">' + icon + "</div><p>" + esc(msg) + "</p></div>";
      }

      // ═══════════════════ API ═══════════════════
      async function api(method, path, body, tid, roleOverride) {
        const tenantId = tid !== undefined ? tid : S.tenantId;
        const effectiveRole = roleOverride || S.role;
        const headers = { "content-type": "application/json", "x-role": effectiveRole, "x-actor-id": "portal-user" };
        if (tenantId) headers["x-tenant-id"] = tenantId;
        const opts = { method, headers };
        if (body != null) opts.body = JSON.stringify(body);
        const res = await fetch("/api/v1" + path, opts);
        const data = await res.json().catch(() => ({}));
        if (!res.ok)
          throw Object.assign(new Error(data.error || data.detail || "HTTP " + res.status), { status: res.status });
        return data;
      }

      async function apiUpload(path, formData, tid) {
        const tenantId = tid !== undefined ? tid : S.tenantId;
        const headers = { "x-role": S.role, "x-actor-id": "portal-user" };
        if (tenantId) headers["x-tenant-id"] = tenantId;
        const res = await fetch("/api/v1" + path, { method: "POST", headers, body: formData });
        const data = await res.json().catch(() => ({}));
        if (!res.ok)
          throw Object.assign(new Error(data.error || data.detail || "HTTP " + res.status), { status: res.status });
        return data;
      }

      const GET = (p, tid) => api("GET", p, undefined, tid);
      const POST = (p, b, tid) => api("POST", p, b, tid);
      const PUT = (p, b, tid) => api("PUT", p, b, tid);

      // ═══════════════════ SSE ═══════════════════
      let _sseCtrl = null;

      async function connectSSE() {
        if (!S.tenantId) return;
        if (_sseCtrl) {
          _sseCtrl.abort();
        }
        _sseCtrl = new AbortController();
        const dot = () => document.getElementById("sse-dot");
        const lbl = () => document.getElementById("sse-lbl");
        try {
          const res = await fetch("/api/v1/events/stream", {
            headers: { "x-tenant-id": S.tenantId, "x-role": S.role, "x-actor-id": "portal-user" },
            signal: _sseCtrl.signal
          });
          if (dot()) {
            dot().className = "sse-dot on";
            lbl().textContent = "Live";
          }
          const reader = res.body.getReader();
          const dec = new TextDecoder();
          let buf = "";
          while (true) {
            const { done, value } = await reader.read();
            if (done) break;
            buf += dec.decode(value, { stream: true });
            const lines = buf.split("\n");
            buf = lines.pop();
            let evt = null;
            for (const line of lines) {
              if (line.startsWith("data: ")) {
                try {
                  evt = JSON.parse(line.slice(6));
                } catch {}
              } else if (line === "" && evt) {
                onSSE(evt);
                evt = null;
              }
            }
          }
        } catch (e) {
          if (e.name !== "AbortError") {
            if (dot()) {
              dot().className = "sse-dot";
              lbl().textContent = "Offline";
            }
            setTimeout(connectSSE, 6000);
          }
        }
      }

      function onSSE(data) {
        const pl = data.payload || {};
        const topic = data.topic || "";
        if (topic === "task.reminder") {
          toast("⏰ Reminder: " + (pl.title || "Task due"), "ok");
          return;
        }
        if (S.view === "inbox") {
          loadConvList();
        }
        if (topic === "conversation.assigned" || topic === "conversation.state_changed") {
          if (pl.conversationId === S.activeConvId) {
          }
          loadConvList();
        }
        if (pl.conversationId && pl.conversationId === S.activeConvId) {
          loadMessages(S.activeConvId, true);
        }
      }

      async function loadMessages(convId, reset) {
        const el = document.getElementById("msgs");
        if (!el) return;
        if (reset) S.msgBefore = null;
        const qs = [];
        if (S.msgBefore) qs.push("before=" + encodeURIComponent(S.msgBefore));
        try {
          const d = await GET("/conversations/" + convId + "/messages" + (qs.length ? "?" + qs.join("&") : ""));
          const incoming = d.items || [];
          if (reset || !S.msgBefore) {
            S.messages = incoming;
          } else {
            S.messages = [...incoming, ...S.messages];
          }
          if (!S.messages.length) {
            el.innerHTML = empty("💬", "No messages yet");
            return;
          }
          const loadMoreBtn = incoming.length >= 50
            ? '<div style="text-align:center;padding:8px"><button class="btn btn-secondary btn-sm" onclick="loadEarlierMessages()">Load earlier messages</button></div>'
            : '';
          el.innerHTML = loadMoreBtn + S.messages
            .map((m) => {
              const text =
                (m.payload && m.payload.text) ||
                m.text ||
                (m.payload && m.payload.media && m.payload.media.caption) ||
                "[" + (m.kind || m.payload?.kind || "message") + "]";
              const dir = m.direction === "outbound" ? "out" : "in";
              return (
                '<div class="msg ' + dir + '" data-mid="' + esc(m.id) + '">' +
                esc(text) +
                '<div class="mt">' + fmtTime(m.occurredAt || m.createdAt) + "</div></div>"
              );
            })
            .join("");
          if (reset || !S.msgBefore) el.scrollTop = el.scrollHeight;
        } catch (e) {
          if (el) el.innerHTML = '<div class="alert alert-err">' + esc(e.message) + '</div>';
        }
      }

      function loadEarlierMessages() {
        const firstMsg = document.querySelector("#msgs .msg[data-mid]");
        if (firstMsg) S.msgBefore = firstMsg.dataset.mid;
        loadMessages(S.activeConvId, false);
      }

      async function sendMsg() {
        if (!S.activeConvId) return;
        const inp = document.getElementById("msg-input");
        const text = inp.value.trim();
        if (!text) return;
        inp.value = "";
        inp.disabled = true;
        try {
          await POST("/conversations/" + S.activeConvId + "/messages", { kind: "text", text });
          toast("Sent ✓", "ok");
          await loadMessages(S.activeConvId, true);
        } catch (e) {
          toast(e.message, "err");
          inp.value = text;
        } finally {
          inp.disabled = false;
          inp.focus();
        }
      }

      function msgKey(e) {
        if (e.key === "Enter" && !e.shiftKey) {
          e.preventDefault();
          sendMsg();
        }
      }

      async function exportContacts() {
        try {
          const term = (document.getElementById("ct-search") || {}).value;
          const qs = term && term.trim() ? "?q=" + encodeURIComponent(term.trim()) : "";
          const res = await fetch("/api/v1/contacts/export" + qs, {
            headers: { "x-role": S.role, "x-actor-id": "portal-user", "x-tenant-id": S.tenantId }
          });
          if (!res.ok) {
            toast("Export failed (" + res.status + ")", "err");
            return;
          }
          const blob = await res.blob();
          const url = URL.createObjectURL(blob);
          const a = document.createElement("a");
          a.href = url;
          a.download = "contacts.csv";
          a.click();
          URL.revokeObjectURL(url);
          toast("Exported", "ok");
        } catch (e) {
          toast(e.message, "err");
        }
      }

              if (fi.files.length) {
                const form = new FormData();

      function handleCsvFile(file) {
        if (!file) return;
        const label = document.getElementById("csv-dz-label");
        if (label)
          label.textContent = "📄 " + file.name + " (" + Math.round(file.size / 1024) + "KB) — ready to import";
        document.getElementById("csv-dz").classList.remove("drag");
      }

      function handleCsvDrop(e) {
        e.preventDefault();
        document.getElementById("csv-dz").classList.remove("drag");
        const file = e.dataTransfer.files[0];
        if (file) {
          document.getElementById("csv-fi").files;
          handleCsvFile(file);
          const dt = new DataTransfer();
          dt.items.add(file);
          document.getElementById("csv-fi").files = dt.files;
        }
      }

        showModal(

          '<div class="field"><label>Segment Name</label><input id="sg-nm" placeholder="High-value customers" /></div>' +
            '<div class="field"><label>Tags (comma-separated, contacts must have ALL)</label><input id="sg-tg" placeholder="vip, active" /></div>' +
            '<div class="field"><label>Country Code</label><input id="sg-co" placeholder="US" /></div>' +
            '<div style="display:flex;flex-direction:column;gap:8px;margin-bottom:14px">' +
            '<label style="display:flex;align-items:center;gap:8px;cursor:pointer;font-size:13px"><input type="checkbox" id="sg-oi" /> Opted-in only (no opt-out contacts)</label>' +
            '<label style="display:flex;align-items:center;gap:8px;cursor:pointer;font-size:13px"><input type="checkbox" id="sg-hc" checked /> Has active consent</label>' +
            "</div>" +
            '<div id="sg-preview" style="color:var(--muted);font-size:12px"></div>',
          null,
          {
            submit: "Create Segment",
            onOk: async () => {
              const nm = document.getElementById("sg-nm").value.trim();
              if (!nm) {
                toast("Name is required", "err");
                return false;
              }
              const tagsRaw = document.getElementById("sg-tg").value.trim();
              const country = document.getElementById("sg-co").value.trim();
              const optedInOnly = document.getElementById("sg-oi").checked;
              const hasConsent = document.getElementById("sg-hc").checked;
              const definition = {};
              if (tagsRaw)
                definition.tags = tagsRaw
                  .split(",")
                  .map((t) => t.trim())

      function showCreateCampaign() {
        // Load segments async, then re-render modal options.
        const approvedTpl = S.templates.filter((t) => t.category === "marketing" && t.status === "approved");
        const segOpts = S.segments.map((s) => '<option value="' + s.id + '">' + esc(s.name) + "</option>").join("");

        // Count {{N}} params in template body.
        let varCount = 0;
        function updateVarMap() {
          const tplId = document.getElementById("cc-tpl")?.value;
          const tpl = S.templates.find((t) => t.id === tplId);
          const body = tpl?.body || "";
          const matches = [...body.matchAll(/\{\{(\d+)\}\}/g)];
          const indices = [...new Set(matches.map((m) => parseInt(m[1])))].sort((a, b) => a - b);
          varCount = indices.length;
          const container = document.getElementById("cc-vars");
          if (!container) return;
          if (!indices.length) {
            container.innerHTML =
              '<p style="color:var(--muted);font-size:12px">This template has no {{N}} parameters.</p>';
            return;
          }
          container.innerHTML =
            '<div style="font-size:11px;color:var(--muted);margin-bottom:8px">MAP TEMPLATE VARIABLES</div>' +
            '<div class="var-row"><label>Param</label><label>Contact Field</label><label>Or Fixed Value</label></div>' +
            indices
              .map(
                (i) =>
                  '<div class="var-row"><label>{{' +
                  i +
                  "}}</label>" +
                  '<select id="vm-field-' +
                  i +
                  '" onchange="document.getElementById(\'vm-lit-' +
                  i +
                  "').disabled=this.value!=='__lit'\">" +
                  '<option value="firstName">First Name</option>' +
                  '<option value="lastName">Last Name</option>' +
                  '<option value="phoneE164">Phone</option>' +
                  '<option value="country">Country</option>' +
                  '<option value="__lit">Fixed value →</option>' +
                  "</select>" +
                  '<input id="vm-lit-' +
                  i +
                  '" placeholder="Fixed text" disabled />' +
                  "</div>"
              )
              .join("");
        }

        showModal(
          "Create Campaign",
          (approvedTpl.length === 0
            ? '<div class="alert alert-info">No approved marketing templates. Sync from Meta first.</div>'
            : "") +
            '<div class="field"><label>Campaign Name</label><input id="cc-nm" placeholder="Summer Sale 2025" /></div>' +
            '<div class="field"><label>Template</label><select id="cc-tpl" onchange="updateVarMap()">' +
            (!approvedTpl.length ? '<option value="">— no approved templates —</option>' : "") +
            approvedTpl
              .map((t) => '<option value="' + t.id + '">' + esc(t.name) + " (" + esc(t.language) + ")</option>")
              .join("") +
            "</select></div>" +
            '<div id="cc-vars" style="margin-bottom:14px"></div>' +
            '<div class="field"><label>Audience Segment</label><select id="cc-seg">' +
            '<option value="">— pick a segment —</option>' +
            segOpts +
            "</select></div>" +
            '<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">' +
            '<div class="field"><label>Send rate (msgs/min)</label><input id="cc-rp" type="number" min="1" max="1000" placeholder="60" /></div>' +
            '<div class="field"><label>Schedule at (optional)</label><input id="cc-sc" type="datetime-local" /></div>' +
            "</div>" +
            '<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">' +
            '<div class="field"><label>Quiet hours start (local hr)</label><input id="cc-qs" type="number" min="0" max="23" placeholder="21" /></div>' +
            '<div class="field"><label>Quiet hours end (local hr)</label><input id="cc-qe" type="number" min="0" max="23" placeholder="8" /></div>' +
            "</div>",
          null,
          {
            submit: "Create Campaign",
            onOk: async () => {
              const nm = document.getElementById("cc-nm").value.trim();
              const tplId = document.getElementById("cc-tpl").value;
              const segId = document.getElementById("cc-seg").value;
              const rp = parseInt(document.getElementById("cc-rp").value) || undefined;
              const scRaw = document.getElementById("cc-sc").value;
              const scheduledAt = scRaw ? new Date(scRaw).toISOString() : undefined;
              const qs = parseInt(document.getElementById("cc-qs").value);
              const qe = parseInt(document.getElementById("cc-qe").value);
              if (!nm) {
                toast("Campaign name is required", "err");
                return false;
              }
              if (!tplId) {
                toast("Select a template", "err");
                return false;
              }
              // Build variable mapping from UI
              const variableMapping = {};
              const tpl = S.templates.find((t) => t.id === tplId);
              const body = tpl?.body || "";
              const matches = [...body.matchAll(/\{\{(\d+)\}\}/g)];
              const indices = [...new Set(matches.map((m) => parseInt(m[1])))].sort((a, b) => a - b);
              for (const i of indices) {
                const fieldEl = document.getElementById("vm-field-" + i);
                const litEl = document.getElementById("vm-lit-" + i);
                if (!fieldEl) continue;
                const fv = fieldEl.value;
                if (fv === "__lit") {
                  const lit = litEl?.value || "";
                  variableMapping[String(i)] = { literal: lit };
                } else {
                  variableMapping[String(i)] = fv;
                }
              }
              const payload = { name: nm, templateId: tplId };
              if (segId) payload.segmentId = segId;
              if (scheduledAt) payload.scheduledAt = scheduledAt;
              if (rp) payload.ratePerMinute = rp;
              if (Object.keys(variableMapping).length) payload.variableMapping = variableMapping;
              if (!isNaN(qs) && !isNaN(qe)) payload.quietHours = { startHour: qs, endHour: qe };
              await POST("/campaigns", payload);
              toast("Campaign created", "ok");
              loadCampaigns();
            }
          }
        );
        setTimeout(() => {
          document.getElementById("cc-nm")?.focus();
          updateVarMap();
        }, 50);
      }

      // ═══════════════════ MODAL ═══════════════════
      function showModal(title, body, rawBody, opts) {
        closeModal();
        opts = opts || {};
        const ov = document.createElement("div");
        ov.className = "overlay";
        ov.id = "modal-ov";
        ov.innerHTML =
          '<div class="modal"><h3>' +
          esc(title) +
          '</h3><div id="modal-body">' +
          (rawBody || body || "") +
          "</div>" +
          (!opts.noAct
            ? '<div class="mact"><button class="btn btn-secondary" onclick="closeModal()">Cancel</button>' +
              (opts.submit ? '<button class="btn btn-primary" id="modal-ok">' + esc(opts.submit) + "</button>" : "") +
              "</div>"
            : "") +
          "</div>";
        ov.addEventListener("click", (e) => {
          if (e.target === ov) closeModal();
        });
        document.body.appendChild(ov);
        if (opts.onOk) {
          const okBtn = document.getElementById("modal-ok");
          if (okBtn) {
            okBtn.addEventListener("click", async () => {
              okBtn.disabled = true;
              try {
                const result = await opts.onOk();
                if (result !== false) closeModal();
              } catch (e) {
                toast(e.message, "err");
              } finally {
                if (okBtn.isConnected) okBtn.disabled = false;
              }
            });
          }
        }
      }

      function closeModal() {
        const m = document.getElementById("modal-ov");
        if (m) m.remove();
      }

          // Campaign draft panel
          '<div class="card"><div class="card-head"><h3>🎯 Campaign Draft</h3></div>' +
          '<div class="field"><label>Objective</label><input id="ai-objective" placeholder="e.g. Re-engage lapsed customers" /></div>' +
          '<div class="field"><label>Audience Description</label><input id="ai-audience-desc" placeholder="e.g. Customers who haven\'t ordered in 90 days" /></div>' +
          '<div class="field"><label>Offer</label><input id="ai-offer" placeholder="e.g. 20% off next order" /></div>' +
          '<div class="field"><label>Tone</label>' +
          '<select id="ai-tone"><option value="professional">Professional</option><option value="friendly">Friendly</option><option value="urgent">Urgent</option></select>' +
          '</div>' +
          '<div class="field"><label>Language</label><input id="ai-lang" value="English" /></div>' +
          '<button class="btn btn-primary" onclick="runCampaignDraft()">Generate Draft</button>' +
          '<div id="ai-draft-result" style="margin-top:12px"></div></div>' +
          // Segment summary panel
          '<div class="card"><div class="card-head"><h3>📊 Segment Summary</h3></div>' +
          '<div class="field"><label>Segment Name</label><input id="ai-seg-name" placeholder="e.g. High-value leads" /></div>' +
          '<div class="field"><label>Contact Count</label><input id="ai-seg-count" type="number" placeholder="e.g. 200" /></div>' +
          '<div class="field"><label>Conversion Rate % (0-100)</label><input id="ai-seg-conv" type="number" step="0.1" placeholder="e.g. 4.5" /></div>' +
          '<div class="field"><label>Opt-Out Rate (0-1)</label><input id="ai-seg-optout" type="number" step="0.001" placeholder="e.g. 0.02" /></div>' +
          '<button class="btn btn-primary" onclick="runSegmentSummary()">Summarise</button>' +
          '<div id="ai-seg-result" style="margin-top:12px"></div></div>' +
          // Lead score panel
          '<div class="card"><div class="card-head"><h3>⭐ Lead Score</h3></div>' +
          '<div class="field"><label>Days Since Last Activity</label><input id="ai-lead-recency" type="number" placeholder="e.g. 14" /></div>' +
          '<div class="field"><label>Engagement Score (0-100)</label><input id="ai-lead-eng" type="number" placeholder="e.g. 65" /></div>' +
          '<div class="field"><label>Purchase Count</label><input id="ai-lead-purchases" type="number" placeholder="e.g. 3" /></div>' +
          '<div class="field"><label>Avg Order Value</label><input id="ai-lead-aov" type="number" placeholder="e.g. 1500" /></div>' +
          '<button class="btn btn-primary" onclick="runLeadScore()">Score Lead</button>' +
          '<div id="ai-lead-result" style="margin-top:12px"></div></div>' +
          '</div></div>';
      }

      async function runCampaignDraft() {
        const objective = document.getElementById("ai-objective")?.value?.trim();
        const audienceDescription = document.getElementById("ai-audience-desc")?.value?.trim();
        const offer = document.getElementById("ai-offer")?.value?.trim();
        const tone = document.getElementById("ai-tone")?.value;
        const language = document.getElementById("ai-lang")?.value?.trim() || "English";
        const resultEl = document.getElementById("ai-draft-result");
        if (!objective) { toast("Enter an objective", "err"); return; }
        if (!audienceDescription) { toast("Enter audience description", "err"); return; }
        if (!offer) { toast("Enter an offer", "err"); return; }
        resultEl.innerHTML = loading();
        try {
          const d = await POST("/ai/campaign-draft", { objective, audienceDescription, offer, tone, language });
          resultEl.innerHTML =
            '<div class="info-box" style="white-space:pre-wrap;font-size:13px">' + esc(d.draft || JSON.stringify(d, null, 2)) + '</div>';
        } catch (e) {
          resultEl.innerHTML = '<div class="alert alert-err">' + esc(e.message) + '</div>';
        }
      }

      async function runSegmentSummary() {
        const segmentName = document.getElementById("ai-seg-name")?.value?.trim();
        const contacts = Number(document.getElementById("ai-seg-count")?.value);
        const conversionRate = Number(document.getElementById("ai-seg-conv")?.value);
        const optOutRate = Number(document.getElementById("ai-seg-optout")?.value);
        const resultEl = document.getElementById("ai-seg-result");
        if (!segmentName) { toast("Enter a segment name", "err"); return; }
        if (!contacts || contacts <= 0) { toast("Enter contact count > 0", "err"); return; }
        resultEl.innerHTML = loading();
        try {
          const d = await POST("/ai/segment-summary", { segmentName, contacts, conversionRate: conversionRate || 0, optOutRate: optOutRate || 0 });
          resultEl.innerHTML =
            '<div class="info-box" style="white-space:pre-wrap;font-size:13px">' + esc(d.summary || JSON.stringify(d, null, 2)) + '</div>';
        } catch (e) {
          resultEl.innerHTML = '<div class="alert alert-err">' + esc(e.message) + '</div>';
        }
      }

      async function runLeadScore() {
        const recencyDays = Number(document.getElementById("ai-lead-recency")?.value);
        const engagementScore = Number(document.getElementById("ai-lead-eng")?.value);
        const purchaseCount = Number(document.getElementById("ai-lead-purchases")?.value);
        const averageOrderValue = Number(document.getElementById("ai-lead-aov")?.value);
        const resultEl = document.getElementById("ai-lead-result");
        resultEl.innerHTML = loading();
        try {
          const d = await POST("/ai/lead-score", { recencyDays: recencyDays || 0, engagementScore: engagementScore || 0, purchaseCount: purchaseCount || 0, averageOrderValue: averageOrderValue || 0 });
          const score = d.score ?? d.leadScore;
          resultEl.innerHTML = score !== undefined
            ? '<div class="kpis"><div class="kpi"><b style="font-size:28px">' + score + '</b><span>Lead Score</span></div></div>' +
              (d.recommendation ? '<div class="info-box" style="margin-top:8px;font-size:13px">' + esc(d.recommendation) + '</div>' : '')
            : '<div class="info-box" style="white-space:pre-wrap;font-size:13px">' + esc(JSON.stringify(d, null, 2)) + '</div>';
        } catch (e) {
          resultEl.innerHTML = '<div class="alert alert-err">' + esc(e.message) + '</div>';
        }
      }

      // ═══════════════════ TENANTS ═══════════════════
      async function renderTenants() {
        const el = document.getElementById("v-tenants");
        el.style.flexDirection = "column";
        el.style.overflow = "auto";
        if (S.role !== "platform_owner") {
          el.innerHTML =
            '<div class="pv"><div class="pv-head"><div><h2>Tenants</h2></div></div>' +
            empty("🔒", "Platform owner access required") + '</div>';
          return;
        }
        el.innerHTML =
          '<div class="pv"><div class="pv-head"><div><h2>Tenants</h2><div class="sub">All registered workspaces</div></div>' +
          '<button class="btn btn-primary btn-sm" onclick="showCreateTenant()">+ New Tenant</button></div>' +
          '<div id="ten-body">' + loading() + '</div></div>';
        await loadTenants();
      }

      async function loadTenants() {
        const bodyEl = document.getElementById("ten-body");
        if (!bodyEl) return;
        try {
          const d = await GET("/tenants");
          const items = d.items || d.tenants || [];
          if (!items.length) {
            bodyEl.innerHTML = empty("🏢", "No tenants yet — create one to get started");
            return;
          }
          bodyEl.innerHTML =
            '<div class="card"><div class="card-head"><h3>All Tenants (' + items.length + ')</h3></div>' +
            '<table class="tbl"><thead><tr><th>Name</th><th>Status</th><th>ID</th><th>Created</th></tr></thead><tbody>' +
            items.map(t =>
              '<tr><td><b>' + esc(t.name) + '</b></td>' +
              '<td>' + bdg(t.status || 'active', t.status === 'suspended' ? 'red' : 'green') + '</td>' +
              '<td><code style="font-size:11px">' + esc((t.id || '').slice(0, 8)) + '…</code></td>' +
              '<td style="color:var(--muted)">' + fmtTime(t.created_at || t.createdAt) + '</td></tr>'
            ).join("") +
            '</tbody></table></div>';
        } catch (e) {
          if (bodyEl) bodyEl.innerHTML = '<div class="alert alert-err">' + esc(e.message) + '</div>';
        }
      }

      function showCreateTenant() {
        showModal(
          "Create Tenant",
          null,
          '<div class="field"><label>Company / Workspace Name</label><input id="new-tenant-name" placeholder="Acme Corp" autocomplete="off" /></div>',
          {
            submit: "Create",
            onOk: async () => {
              const name = document.getElementById("new-tenant-name")?.value?.trim();
              if (!name) { toast("Name is required", "err"); return false; }
              await api("POST", "/tenants", { name }, "", "platform_owner");
              toast("Tenant created", "ok");
              await loadTenants();
            }
          }
        );
        setTimeout(() => document.getElementById("new-tenant-name")?.focus(), 50);
      }

      // ═══════════════════ BOOT ═══════════════════
      if (S.tenantId) {
        initApp();
      } else {
        renderSetup();
      }
    </script>
  </body>
</html>
