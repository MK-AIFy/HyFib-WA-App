# Internal nginx serving the SPA build. Listens on 8080 (non-root friendly);
# the edge proxy forwards the catch-all here after /api/ and /auth/ are routed
# to the gateway. SPA fallback sends unknown paths to index.html so client-side
# routes (e.g. /inbox, /contacts) resolve on hard refresh.
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Hashed assets are immutable; cache them aggressively.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  location / {
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    try_files $uri /index.html;
  }
}
