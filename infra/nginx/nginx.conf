worker_processes auto;

events {
  worker_connections 2048;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  # Do not leak the nginx version in responses / error pages.
  server_tokens off;

  sendfile on;
  keepalive_timeout 65;
  client_max_body_size 4m;

  limit_req_zone $binary_remote_addr zone=api_limit:10m rate=60r/s;
  limit_req_zone $binary_remote_addr zone=webhook_limit:10m rate=30r/s;

  map $http_user_agent $is_bot {
    default 0;
    ~*(curl|wget|python|scanner|sqlmap|nikto) 1;
  }

  # Modular monolith. Upstream name kept as `api_gateway` to minimize the diff
  # across the location blocks; the target is now the consolidated app-server.
  upstream api_gateway {
    server app-server:8080;
  }

  upstream web_app {
    server web-app:8080;
  }

  # ---- HTTP: redirect everything to HTTPS ----------------------------------
  server {
    listen 80;
    server_name _;
    # Allow ACME/manual health probing on plain HTTP if ever needed, otherwise
    # force TLS for all traffic.
    location / {
      return 301 https://$host$request_uri;
    }
  }

  # ---- HTTPS: terminate TLS and proxy to the platform ----------------------
  # Operators must provide a certificate + key at the mounted paths below.
  # For local/dev use, run: ./scripts/generate-dev-tls-cert.sh
  server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # Security headers applied to every response.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; frame-ancestors 'none'" always;

    if ($is_bot = 1) {
      return 403;
    }

    location /api/v1/webhooks/meta/whatsapp {
      limit_req zone=webhook_limit burst=20 nodelay;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_pass http://api_gateway;
    }

    # Server-Sent Events stream: long-lived connection, no buffering.
    location /api/v1/events/stream {
      limit_req zone=api_limit burst=20 nodelay;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_buffering off;
      proxy_cache off;
      proxy_read_timeout 3600s;
      proxy_pass http://api_gateway;
    }

    location /api/ {
      limit_req zone=api_limit burst=100 nodelay;
      # Media uploads (channel media endpoint) carry raw file bytes.
      client_max_body_size 16m;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_pass http://api_gateway;
    }

    # Campaign shortlink redirects (GET /r/<token>) — served by the gateway;
    # without this block they fall through to the SPA catch-all and click
    # tracking never records.
    location /r/ {
      limit_req zone=api_limit burst=50 nodelay;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_pass http://api_gateway;
    }

    # Native session auth (register/login/logout/me) — served by the app-server
    # gateway module, not the SPA. Without this block these paths fall through to
    # the catch-all below and 404 against the static web-app server.
    location /auth/ {
      limit_req zone=api_limit burst=100 nodelay;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_pass http://api_gateway;
    }

    location /health {
      proxy_set_header Host $host;
      proxy_pass http://api_gateway;
    }

    location / {
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_pass http://web_app;
    }
  }
}
