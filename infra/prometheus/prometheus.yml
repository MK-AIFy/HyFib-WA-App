global:
  scrape_interval: 15s

scrape_configs:
  - job_name: api-gateway
    static_configs:
      - targets: ["api-gateway:8080"]

  - job_name: auth-service
    static_configs:
      - targets: ["auth-service:8082"]

  - job_name: tenant-service
    static_configs:
      - targets: ["tenant-service:8083"]

  - job_name: contact-service
    static_configs:
      - targets: ["contact-service:8084"]

  - job_name: conversation-service
    static_configs:
      - targets: ["conversation-service:8085"]

  - job_name: campaign-service
    static_configs:
      - targets: ["campaign-service:8086"]

  - job_name: template-service
    static_configs:
      - targets: ["template-service:8087"]

  - job_name: commerce-service
    static_configs:
      - targets: ["commerce-service:8088"]

  - job_name: billing-usage-service
    static_configs:
      - targets: ["billing-usage-service:8089"]

  - job_name: reporting-service
    static_configs:
      - targets: ["reporting-service:8090"]

  - job_name: audit-service
    static_configs:
      - targets: ["audit-service:8091"]

  - job_name: meta-adapter
    static_configs:
      - targets: ["meta-adapter:8092"]

  - job_name: webhook-ingestor
    static_configs:
      - targets: ["webhook-ingestor:8093"]

  - job_name: notification-worker
    static_configs:
      - targets: ["notification-worker:8094"]

  - job_name: ai-intelligence-service
    static_configs:
      - targets: ["ai-intelligence-service:8095"]
