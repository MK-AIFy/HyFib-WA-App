global:
  scrape_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  # The deployed runtime is the app-server modular monolith: one /metrics
  # endpoint carries gateway + worker + ingestor + adapter counters. The old
  # per-service jobs scraped containers that no longer exist post-
  # consolidation, leaving every target permanently down.
  - job_name: app-server
    metrics_path: /metrics
    static_configs:
      - targets: ["app-server:8080"]
