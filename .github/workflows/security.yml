name: Security Checks

on:
  pull_request:
  schedule:
    - cron: "0 2 * * 1"

jobs:
  security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      # gitleaks-action scans the PR's commit range (<first commit>^..<head>), so it needs the full history:
      # with the default shallow checkout it fails with "unknown revision", scans ~0 bytes and reports
      # nothing — the secret scan silently never ran on any PR.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.1

      - name: Install Dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Dependency Audit (Prod)
        run: pnpm audit --prod || true

      - name: Gitleaks Secret Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
