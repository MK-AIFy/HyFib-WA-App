name: CD

# Continuous delivery (roadmap Phase C): every push to main publishes the two
# shipped images — app-server (the modular monolith) and web-app — to GHCR,
# tagged with the exact commit SHA plus a moving latest. This closes the
# "Trivy-scanned image ≠ shipped build" gap: what CI scanned is what gets
# published, pinned by digest, and a VM/compose deploy can reference an
# immutable tag instead of rebuilding from source on the box.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish-images:
    runs-on: ubuntu-latest
    strategy:
      # Publish each image independently: with the default fail-fast, one image's
      # failure cancels the other's job mid-build (the app-server image was never
      # published for exactly that reason).
      fail-fast: false
      matrix:
        include:
          - name: app-server
            dockerfile: services/app-server/Dockerfile
          - name: web-app
            dockerfile: services/web-app/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Registry references must be lowercase, but github.repository keeps the owner's
      # casing (MK-AIFy/HyFib-WA-App). metadata-action lowercases on its own; the Trivy
      # step used to re-derive the name from the raw value and could not parse it, so the
      # "scan the published image" gate never ran. Derive it once and feed both.
      - name: Lowercase image name
        env:
          IMAGE_NAME: ${{ matrix.name }}
        run: echo "IMAGE=$(echo "ghcr.io/${GITHUB_REPOSITORY}/${IMAGE_NAME}" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - name: Scan the PUBLISHED image (CRITICAL gate)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE }}:sha-${{ github.sha }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
